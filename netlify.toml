[[redirects]]
  from = "http://proxipro.com/*"
  to = "https://proxipro.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.proxipro.com/*"
  to = "https://proxipro.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
